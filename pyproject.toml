[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "tprm-assessor"
version = "0.1.0"
description = "Agentic Third-Party Risk Management Assessor using Claude"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Moudy AI" }]
dependencies = [
    "anthropic>=0.44.0",
    "pydantic>=2.10.0",
    "pydantic-settings>=2.7.0",
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "python-dotenv>=1.0.0",
    "click>=8.1.0",
    "jinja2>=3.1.0",
]

[project.scripts]
tprm = "tprm.cli:main"
tprm-serve = "tprm.api.main:run"

[tool.hatch.build.targets.wheel]
packages = ["src/tprm"]

[tool.uv]
package = true

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
    "black>=24.0.0",
    "ruff>=0.8.0",
]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
